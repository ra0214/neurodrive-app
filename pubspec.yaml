name: neurodrive
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  device_preview: ^1.3.1
  flutter_riverpod: ^2.5.1
  http: ^1.6.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  
  # Voz e IA
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # Firebase
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10

  # Seguridad y Core
  screen_protector: ^1.5.1
  safe_device: ^1.1.6
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  permission_handler: ^12.0.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
